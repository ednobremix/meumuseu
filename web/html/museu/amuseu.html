<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>Museu Virtual 3D</title>


    <!-- =====================================================
         A-FRAME
         ===================================================== -->

    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>


    <!-- =====================================================
         ESTILO DA INTERFACE
         ===================================================== -->

    <style>

        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #111;

            font-family:
                    Arial,
                    Helvetica,
                    sans-serif;

        }


        /* =================================================
           TELA DE CARREGAMENTO
           ================================================= */

        #loading {

            position: fixed;

            inset: 0;

            z-index: 99999;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            background:
                    radial-gradient(
                            circle,
                            #34302b 0%,
                            #181614 65%,
                            #0c0b0a 100%
                    );

            color: white;

            transition:
                    opacity 0.7s ease;

        }


        #loading h1 {

            margin: 0 0 15px;

            font-size: 32px;

            font-weight: 300;

            letter-spacing: 7px;

        }


        #loading p {

            margin: 0;

            color: #c8c0b7;

            font-size: 14px;

            letter-spacing: 1px;

        }


        /* =================================================
           TÍTULO DO MUSEU
           ================================================= */

        #museum-title {

            position: fixed;

            top: 18px;

            left: 50%;

            transform:
                    translateX(-50%);

            z-index: 1000;

            padding:
                    9px 20px;

            background:
                    rgba(
                            20,
                            18,
                            16,
                            0.70
                    );

            border:
                    1px solid
                    rgba(
                            255,
                            255,
                            255,
                            0.12
                    );

            border-radius: 4px;

            color: white;

            font-size: 13px;

            letter-spacing: 4px;

            pointer-events: none;

        }


        /* =================================================
           INSTRUÇÕES
           ================================================= */

        #instructions {

            position: fixed;

            left: 18px;

            bottom: 18px;

            z-index: 1000;

            padding:
                    12px 16px;

            background:
                    rgba(
                            20,
                            18,
                            16,
                            0.78
                    );

            border-radius: 6px;

            color: #eee;

            font-size: 13px;

            line-height: 1.7;

            pointer-events: none;

        }


        #instructions strong {

            color: white;

            letter-spacing: 1px;

        }


        /* =================================================
           OVERLAY DE TELA CHEIA
           ================================================= */

        #overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 200000;
            background: rgba(0, 0, 0, 0.95);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: white;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        #overlay.active {
            display: flex;
            opacity: 1;
        }

        #overlay img {
            max-width: 90vw;
            max-height: 70vh;
            border: 5px solid #333;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
            margin-bottom: 20px;
            object-fit: contain;
        }

        #overlay-info {
            text-align: center;
            max-width: 800px;
        }

        #overlay-title {
            font-size: 28px;
            margin: 0 0 10px;
            letter-spacing: 2px;
            color: #d9d5ce;
        }

        #overlay-author {
            font-size: 18px;
            margin: 0 0 20px;
            color: #aaa;
            font-style: italic;
        }

        #close-overlay {
            position: absolute;
            top: 30px;
            right: 40px;
            font-size: 40px;
            cursor: pointer;
            color: #fff;
            background: none;
            border: none;
            padding: 10px;
        }

        #close-overlay:hover {
            color: #d9d5ce;
        }

        /* CHECKLIST DE OBRAS VISUALIZADAS */
        #checklist-trigger {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 150000;
            background: rgba(24, 22, 20, 0.85);
            color: white;
            border: 1px solid #76554a;
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        #checklist-trigger:hover {
            background: #76554a;
        }

        #checklist-trigger.completou {
            background: #4caf50;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(76, 175, 80, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(76, 175, 80, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(76, 175, 80, 0); }
        }

        #checklist-panel {
            position: fixed;
            top: 70px;
            right: 20px;
            width: 300px;
            max-height: 80vh;
            background: rgba(24, 22, 20, 0.95);
            border: 1px solid #76554a;
            z-index: 150000;
            display: none;
            flex-direction: column;
            padding: 20px;
            color: white;
            border-radius: 4px;
            overflow-y: auto;
        }

        #checklist-panel.active {
            display: flex;
        }

        #checklist-panel h3 {
            margin: 0 0 15px 0;
            font-size: 20px;
            border-bottom: 1px solid #76554a;
            padding-bottom: 10px;
            text-align: center;
        }

        #checklist-items {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .checklist-item {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            font-size: 14px;
            padding: 5px;
            border-bottom: 1px solid #333;
        }

        .checklist-item.visto {
            color: #4caf50;
            text-decoration: line-through;
            opacity: 0.7;
        }

        .checklist-item input {
            margin-right: 10px;
            pointer-events: none;
        }

        #checklist-progress {
            margin-bottom: 15px;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            color: #ffcc00;
        }

        /* HUD DE INFORMAÇÃO AO FOCAR */
        #hud-info {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100000;
            background: rgba(24, 22, 20, 0.85);
            padding: 15px 30px;
            border: 1px solid #76554a;
            border-radius: 4px;
            text-align: center;
            pointer-events: none;
            display: none;
            min-width: 250px;
        }

        #hud-info h2 {
            margin: 0;
            font-size: 18px;
            letter-spacing: 1px;
            color: #f1ede8;
        }

        #hud-info p {
            margin: 5px 0 0;
            font-size: 13px;
            color: #c8c0b7;
        }

        /* CONTROLES MOBILE */
        #mobile-controls {
            display: none;
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 100000;
            width: 150px;
            height: 150px;
            pointer-events: none; /* Deixa cliques passarem pelo container */
        }

        .mobile-btn {
            position: absolute;
            width: 45px;
            height: 45px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 20px;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            transition: background 0.2s;
            pointer-events: auto; /* Reabilita para os botões */
        }

        .mobile-btn:active {
            background: rgba(255, 255, 255, 0.4);
        }

        #btn-up { top: 0; left: 52.5px; }
        #btn-down { bottom: 0; left: 52.5px; }
        #btn-left { top: 52.5px; left: 0; }
        #btn-right { top: 52.5px; right: 0; }

        @media (max-width: 768px) {
            #mobile-controls {
                display: block;
            }
            #instructions {
                display: none;
            }
        }


        /* =================================================
           AVISO DE ERRO
           ================================================= */

        #error {

            display: none;

            position: fixed;

            left: 50%;

            top: 50%;

            transform:
                    translate(
                            -50%,
                            -50%
                    );

            z-index: 100000;

            width:
                    min(
                            500px,
                            85vw
                    );

            padding: 25px;

            background: #251d1a;

            color: white;

            border:
                    1px solid
                    #76554a;

            border-radius: 8px;

            text-align: center;

        }

    </style>

</head>

<script>

    document.addEventListener(

                    /* =========================================
                       DADOS DAS OBRAS

                        /*

                        criarQuadro(29, "esquerda", -8.82, -109);

                        criarQuadro(31, "direita", 8.82, -109);

                    }

                    carregarObras();



                    /* =================================================
                       CRIA QUADRO
                       ================================================= */

                    function criarQuadro(
                        numero,
                        lado,
                        x,
                        z
                    ) {


                        const obra =
                            obras[
                            numero - 1
                                ];


                        const grupo =
                            document.createElement(
                                "a-entity"
                            );


                        /*
                         * TODOS OS QUADROS:
                         *
                         * mesma altura
                         * mesma dimensão
                         */

                        grupo.setAttribute(
                            "position",
                            `${x} 3.8 ${z}`
                        );


                        if (
                            lado === "esquerda"
                        ) {


                            grupo.setAttribute(
                                "rotation",
                                "0 90 0"
                            );


                        } else if (
                            lado === "direita"
                        ) {


                            grupo.setAttribute(
                                "rotation",
                                "0 -90 0"
                            );


                        } else if (
                            lado === "fundo"
                        ) {


                            grupo.setAttribute(
                                "rotation",
                                "0 0 0"
                            );

                            if (numero === 33) {
                                grupo.setAttribute(
                                    "position",
                                    "0 3.8 -124.82"
                                );
                            }


                        }

                        /* =============================================
                           MOLDURA EXTERNA (Madeira)
                           ============================================= */

                        const molduraExterna =
                            document.createElement(
                                "a-box"
                            );

                        molduraExterna.setAttribute(
                            "width",
                            "5.2"
                        );

                        molduraExterna.setAttribute(
                            "height",
                            "4.1"
                        );

                        molduraExterna.setAttribute(
                            "depth",
                            "0.2"
                        );

                        molduraExterna.setAttribute(
                            "color",
                            "#3d2b1f" // Marrom madeira escuro
                        );

                        grupo.appendChild(
                            molduraExterna
                        );

                        /* =============================================
                           MOLDURA INTERNA / PASSE-PARTOUT
                           ============================================= */

                        const passePartout =
                            document.createElement(
                                "a-box"
                            );

                        passePartout.setAttribute(
                            "width",
                            "4.6"
                        );

                        passePartout.setAttribute(
                            "height",
                            "3.5"
                        );

                        passePartout.setAttribute(
                            "depth",
                            "0.1"
                        );

                        passePartout.setAttribute(
                            "position",
                            "0 0 0.05"
                        );

                        passePartout.setAttribute(
                            "color",
                            "#f5f5dc" // Bege / Off-white
                        );

                        grupo.appendChild(
                            passePartout
                        );

                        /* =============================================
                           IMAGEM (A tela propriamente dita)
                           ============================================= */

                        const imagem =
                            document.createElement(
                                "a-plane"
                            );

                        // Dimensões máximas permitidas para a imagem dentro do passe-partout
                        let MAX_WIDTH = 4.35;
                        let MAX_HEIGHT = 3.25;

                        // Aumenta o tamanho da tela 33 em 60% e ajusta molduras
                        if (numero === 33) {
                            MAX_WIDTH *= 1.6;
                            MAX_HEIGHT *= 1.6;
                            
                            molduraExterna.setAttribute("width", MAX_WIDTH + 0.85);
                            molduraExterna.setAttribute("height", MAX_HEIGHT + 0.85);
                            passePartout.setAttribute("width", MAX_WIDTH + 0.25);
                            passePartout.setAttribute("height", MAX_HEIGHT + 0.25);
                        }

                        // Inicializa com dimensões máximas (evita que o plano fique invisível antes de carregar)
                        imagem.setAttribute("width", MAX_WIDTH);
                        imagem.setAttribute("height", MAX_HEIGHT);

                        /*
                         * Ajusta a proporção da imagem e das molduras assim que ela carregar
                         */
                        const imgAsset = document.querySelector(`#tela${numero}`);
                        if (imgAsset) {
                            const ajustarDimensoes = () => {
                                const w = imgAsset.naturalWidth;
                                const h = imgAsset.naturalHeight;
                                if (w && h) {
                                    const proporcaoImagem = w / h;
                                    const proporcaoContainer = MAX_WIDTH / MAX_HEIGHT;

                                    let finalWidth, finalHeight;

                                    if (proporcaoImagem > proporcaoContainer) {
                                        // Mais larga que o container (Paisagem extrema)
                                        finalWidth = MAX_WIDTH;
                                        finalHeight = MAX_WIDTH / proporcaoImagem;
                                    } else {
                                        // Mais alta que o container (Retrato ou Paisagem leve)
                                        finalHeight = MAX_HEIGHT;
                                        finalWidth = MAX_HEIGHT * proporcaoImagem;
                                    }

                                    // Aplica as dimensões na imagem
                                    imagem.setAttribute("width", finalWidth);
                                    imagem.setAttribute("height", finalHeight);

                                    // Ajusta o Passe-Partout (margem de ~0.15 em cada lado)
                                    passePartout.setAttribute("width", finalWidth + 0.25);
                                    passePartout.setAttribute("height", finalHeight + 0.25);

                                    // Ajusta a Moldura Externa (margem de ~0.3 em relação ao passe-partout)
                                    molduraExterna.setAttribute("width", finalWidth + 0.85);
                                    molduraExterna.setAttribute("height", finalHeight + 0.85);
                                }
                            };

                            if (imgAsset.complete) {
                                ajustarDimensoes();
                            } else {
                                imgAsset.addEventListener("load", ajustarDimensoes);
                            }
                        }

                        /*
                         * A imagem fica ligeiramente à frente do passe-partout
                         */

                        imagem.setAttribute(
                            "position",
                            "0 0 0.11"
                        );


                        imagem.setAttribute(
                            "material",
                            `src: #tela${numero}; side: double; roughness: 0.5; metalness: 0.1; shader: standard`
                        );

                        // Adiciona classes e dados para interação
                        imagem.classList.add("interactable");
                        imagem.setAttribute("data-numero", numero);
                        imagem.setAttribute("data-titulo", obra.titulo);
                        imagem.setAttribute("data-autor", obra.autor);
                        imagem.setAttribute("data-tecnica", obra.tecnica);

                        grupo.appendChild(
                            imagem
                        );



                        /* =============================================
                          QUADRO NA CENA
                          ============================================= */

                        scene.appendChild(
                            grupo
                        );

                    }









                    /* =================================================
                       TECLADO
                       ================================================= */

                    const teclas = {};
                    let targetRotation = 0;
                    let currentRotation = 0;
                    let isRotating = false;

                    // Coordenadas Z dos quadros laterais para centralização
                    const quadrosZ = [
                        -4, -11,       // Sala 1
                        -19, -26,      // Sala 2
                        -34, -41,      // Sala 3
                        -49, -56,      // Sala 4
                        -64, -71,      // Sala 5
                        -79, -86,      // Sala 6
                        -94, -101,     // Sala 7
                        -109, -116     // Sala 8
                    ];
                    const posFundoZ = -121;
                    const limiteFundoZ = -120;

                    function navegarEntreQuadros(direcao) {
                        const pos = player.getAttribute("position");
                        if (!pos) return false;

                        // Encontrar o índice do quadro mais próximo
                        let currentIndex = 0;
                        let minDiff = Math.abs(pos.z - quadrosZ[0]);

                        for (let i = 1; i < quadrosZ.length; i++) {
                            let diff = Math.abs(pos.z - quadrosZ[i]);
                            if (diff < minDiff) {
                                minDiff = diff;
                                currentIndex = i;
                            }
                        }

                                // Mover para o próximo ou anterior SOMENTE se estiver na mesma sala
                                let nextIndex = currentIndex + direcao;
                                
                                // Verifica se o próximo índice está dentro dos limites do array
                                if (nextIndex >= 0 && nextIndex < quadrosZ.length) {
                                    // Verifica se pertencem à mesma sala (S1-S8, todas com 2 posições Z)
                                    const salaAtual = Math.floor(currentIndex / 2);
                                    const salaProxima = Math.floor(nextIndex / 2);
                                    
                                    if (salaAtual === salaProxima) {
                                        pos.z = quadrosZ[nextIndex];
                                        player.setAttribute("position", pos);
                                        return true; // Navegou com sucesso
                                    }
                                }
                        return false; // Não há mais quadros nesta sala
                    }

                    function centralizarNoQuadro() {
                        const pos = player.getAttribute("position");
                        if (!pos) return;

                        let nearestZ = quadrosZ[0];
                        let minDiff = Math.abs(pos.z - quadrosZ[0]);

                        for (let i = 1; i < quadrosZ.length; i++) {
                            let diff = Math.abs(pos.z - quadrosZ[i]);
                            if (diff < minDiff) {
                                minDiff = diff;
                                nearestZ = quadrosZ[i];
                            }
                        }

                        pos.z = nearestZ;
                        player.setAttribute("position", pos);
                    }

                    function processarComando(key) {
                        // Rotação ou Navegação Lateral
                        if (!isRotating) {
                            let normalizedRot = ((targetRotation % 360) + 360) % 360;
                            const olhandoParaLado = Math.abs((targetRotation / 90) % 2) !== 0;
                            const olhandoParaFrente = Math.abs(normalizedRot) < 1;
                            const olhandoParaTras = Math.abs(normalizedRot - 180) < 1;

                            if (olhandoParaLado) {
                                const pos = player.getAttribute("position");
                                let currentIndex = 0;
                                let minDiff = Math.abs(pos.z - quadrosZ[0]);
                                for (let i = 1; i < quadrosZ.length; i++) {
                                    let diff = Math.abs(pos.z - quadrosZ[i]);
                                    if (diff < minDiff) {
                                        minDiff = diff;
                                        currentIndex = i;
                                    }
                                }

                                // Mapeamento real dos IDs dos quadros baseado na parede e posição Z
                                const idsEsquerda = [1, 2, 5, 6, 9, 10, 13, 14, 17, 18, 21, 22, 25, 26, 29, 30];
                                const idsDireita = [3, 4, 7, 8, 11, 12, 15, 16, 19, 20, 23, 24, 27, 28, 31, 32];

                                let currentID = 0;
                                if (Math.abs(normalizedRot - 90) < 1) {
                                    currentID = idsEsquerda[currentIndex];
                                } else if (Math.abs(normalizedRot - 270) < 1) {
                                    currentID = idsDireita[currentIndex];
                                }

                                const isOdd = currentID % 2 !== 0;
                                const isEven = currentID % 2 === 0;

                                if (key === "a" || key === "arrowleft") {
                                    // Transição Especial: 32 (Direita) -> 33 (Fundo)
                                    if (currentID === 32) {
                                        targetRotation = 0; // Gira para frente
                                        isRotating = true;
                                        pos.z = posFundoZ; // Posição para ver o fundo
                                        pos.x = 0; // Alinha com o quadro 33
                                        player.setAttribute("position", pos);
                                        return;
                                    }

                                    // Regra: Ímpar (Esq -> Gira), Par (Esq -> Navega)
                                    if (isOdd) {
                                        targetRotation += 90;
                                        isRotating = true;
                                        if (Math.abs(targetRotation / 90) % 2 !== 0) {
                                            centralizarNoQuadro();
                                        }
                                    } else if (isEven) {
                                        let dir = (Math.abs(normalizedRot - 90) < 1) ? -1 : 1;
                                        if (!navegarEntreQuadros(dir)) {
                                            targetRotation += 90;
                                            isRotating = true;
                                            if (Math.abs(targetRotation / 90) % 2 !== 0) {
                                                centralizarNoQuadro();
                                            }
                                        }
                                    }
                                } else if (key === "d" || key === "arrowright") {
                                    // Transição Especial: 32 (Direita) -> 33 (Fundo)
                                    if (currentID === 32) {
                                        targetRotation = 0; // Gira para frente
                                        isRotating = true;
                                        pos.z = posFundoZ; // Posição para ver o fundo
                                        pos.x = 0; // Alinha com o quadro 33
                                        player.setAttribute("position", pos);
                                        return;
                                    }

                                    // Regra: Par (Dir -> Gira), Ímpar (Dir -> Navega)
                                    if (isEven) {
                                        targetRotation -= 90;
                                        isRotating = true;
                                        if (Math.abs(targetRotation / 90) % 2 !== 0) {
                                            centralizarNoQuadro();
                                        }
                                    } else if (isOdd) {
                                        let dir = (Math.abs(normalizedRot - 90) < 1) ? 1 : -1;
                                        if (!navegarEntreQuadros(dir)) {
                                            targetRotation -= 90;
                                            isRotating = true;
                                            if (Math.abs(targetRotation / 90) % 2 !== 0) {
                                                centralizarNoQuadro();
                                            }
                                        }
                                    }
                                } else if (key === "s" || key === "arrowdown") {
                                    targetRotation += 180;
                                    isRotating = true;
                                }
                            } else if (olhandoParaFrente) {
                                const pos = player.getAttribute("position");

                                // Pular para frente da próxima tela (ao apertar W ou Seta para Cima)
                                if (key === "w" || key === "arrowup") {
                                    let nextZ = null;
                                    // Indo para o fundo (Z diminui)
                                    for (let i = 0; i < quadrosZ.length; i++) {
                                        if (quadrosZ[i] < pos.z - 0.5) {
                                            if (nextZ === null || quadrosZ[i] > nextZ) {
                                                nextZ = quadrosZ[i];
                                            }
                                        }
                                    }
                                    // Se não houver mais quadros laterais à frente, pular para o fundo
                                    if (nextZ === null && pos.z > posFundoZ) {
                                        nextZ = posFundoZ;
                                    }

                                    if (nextZ !== null) {
                                        pos.z = nextZ;
                                        player.setAttribute("position", pos);
                                        return; // Interrompe para não processar outros comandos
                                    }
                                }

                                // Verificar se está na frente dos quadros do fundo (Z próximo de posFundoZ)
                                if (pos.z <= limiteFundoZ) {
                                    if (key === "a" || key === "arrowleft") {
                                        // Se estiver à direita do centro, vai para o centro
                                        if (pos.x > 0.5) {
                                            pos.x = 0; // Alinha com o centro
                                            player.setAttribute("position", pos);
                                        } else {
                                            // Se já estiver no centro ou esquerda do fundo, volta para a parede lateral
                                            targetRotation = 90; // Gira para esquerda
                                            isRotating = true;
                                            pos.z = -116; // Z do quadro 30
                                            pos.x = 0; // Volta para o trilho central
                                            player.setAttribute("position", pos);
                                        }
                                    } else if (key === "d" || key === "arrowright") {
                                        // Se estiver à esquerda do centro, vai para o centro
                                        if (pos.x < -0.5) {
                                            pos.x = 0; // Alinha com o centro
                                            player.setAttribute("position", pos);
                                        } else {
                                            // Se já estiver no centro ou direita do fundo, vai para a lateral direita
                                            targetRotation = 270; // Gira para direita
                                            isRotating = true;
                                            pos.z = -116; // Z do quadro 31
                                            pos.x = 0; // Volta para o trilho central
                                            player.setAttribute("position", pos);
                                        }
                                    }
                                } else {
                                    // Comportamento padrão de rotação no corredor
                                    if (key === "a" || key === "arrowleft") {
                                        targetRotation += 90;
                                        isRotating = true;
                                        if (Math.abs(targetRotation / 90) % 2 !== 0) {
                                            centralizarNoQuadro();
                                        }
                                    } else if (key === "d" || key === "arrowright") {
                                        targetRotation -= 90;
                                        isRotating = true;
                                        if (Math.abs(targetRotation / 90) % 2 !== 0) {
                                            centralizarNoQuadro();
                                        }
                                    }
                                }

                                if (key === "s" || key === "arrowdown") {
                                    targetRotation += 180;
                                    isRotating = true;
                                }
                            } else if (olhandoParaTras) {
                                const pos = player.getAttribute("position");

                                // Pular para trás (voltando para a entrada) ao apertar W ou Seta para Cima
                                if (key === "w" || key === "arrowup") {
                                    let nextZ = null;
                                    // Voltando para a entrada (Z aumenta)
                                    for (let i = 0; i < quadrosZ.length; i++) {
                                        if (quadrosZ[i] > pos.z + 0.5) {
                                            if (nextZ === null || quadrosZ[i] < nextZ) {
                                                nextZ = quadrosZ[i];
                                            }
                                        }
                                    }
                                    // Se não houver mais quadros laterais atrás, pular para a entrada
                                    if (nextZ === null && pos.z < 0) {
                                        nextZ = 0;
                                    }

                                    if (nextZ !== null) {
                                        pos.z = nextZ;
                                        player.setAttribute("position", pos);
                                        return;
                                    }
                                }

                                if (key === "a" || key === "arrowleft") {
                                    targetRotation += 90;
                                    isRotating = true;
                                    if (Math.abs(targetRotation / 90) % 2 !== 0) {
                                        centralizarNoQuadro();
                                    }
                                } else if (key === "d" || key === "arrowright") {
                                    targetRotation -= 90;
                                    isRotating = true;
                                    if (Math.abs(targetRotation / 90) % 2 !== 0) {
                                        centralizarNoQuadro();
                                    }
                                } else if (key === "s" || key === "arrowdown") {
                                    targetRotation += 180;
                                    isRotating = true;
                                }
                            } else {
                                // Outras direções (Ex: olhando para trás)
                                if (key === "a" || key === "arrowleft") {
                                    targetRotation += 90;
                                    isRotating = true;
                                    if (Math.abs(targetRotation / 90) % 2 !== 0) {
                                        centralizarNoQuadro();
                                    }
                                } else if (key === "d" || key === "arrowright") {
                                    targetRotation -= 90;
                                    isRotating = true;
                                    if (Math.abs(targetRotation / 90) % 2 !== 0) {
                                        centralizarNoQuadro();
                                    }
                                } else if (key === "s" || key === "arrowdown") {
                                    targetRotation += 180;
                                    isRotating = true;
                                }
                            }
                        }
                    }

                    document.addEventListener(
                        "keydown",
                        function (event) {
                            const key = event.key.toLowerCase();
                            teclas[key] = true;
                            processarComando(key);
                        }
                    );



                    document.addEventListener(
                        "keyup",
                        function (event) {

                            teclas[
                                event.key.toLowerCase()
                                ] = false;

                        }
                    );

                    // Lógica para botões mobile
                    const mobileBtns = {
                        'btn-up': 'w',
                        'btn-down': 's',
                        'btn-left': 'a',
                        'btn-right': 'd'
                    };

                    Object.keys(mobileBtns).forEach(id => {
                        const btn = document.getElementById(id);
                        const key = mobileBtns[id];
                        
                        btn.addEventListener('touchstart', (e) => {
                            e.preventDefault();
                            teclas[key] = true;
                            processarComando(key);
                        });

                        btn.addEventListener('mousedown', (e) => {
                            teclas[key] = true;
                            processarComando(key);
                        });
                        
                        btn.addEventListener('touchend', (e) => {
                            e.preventDefault();
                            teclas[key] = false;
                        });

                        btn.addEventListener('mouseup', (e) => {
                            teclas[key] = false;
                        });

                        btn.addEventListener('mouseleave', (e) => {
                            teclas[key] = false;
                        });
                    });




                    /* =================================================
                       INTERAÇÃO COM AS OBRAS
                       ================================================= */

                    const hud = document.getElementById("hud-info");
                    const hudTitle = document.getElementById("hud-title");
                    const hudAuthor = document.getElementById("hud-author");

                    const overlay = document.getElementById("overlay");
                    const overlayImg = document.getElementById("overlay-img");
                    const overlayTitle = document.getElementById("overlay-title");
                    const overlayAuthor = document.getElementById("overlay-author");
                    const overlayTech = document.getElementById("overlay-tech");
                    const closeOverlay = document.getElementById("close-overlay");

                    // RASTREAMENTO DE OBRAS VISTAS
                    let obrasVistas = JSON.parse(localStorage.getItem('obrasVistas') || '[]');
                    let totalObras = 0;
                    let listaObras = [];

                    async function initChecklist() {
                        const resp = await fetch('obras.json');
                        listaObras = await resp.json();
                        totalObras = listaObras.length;
                        updateChecklistUI();
                    }

                    function marcarComoVista(id) {
                        id = parseInt(id);
                        if (!obrasVistas.includes(id)) {
                            obrasVistas.push(id);
                            localStorage.setItem('obrasVistas', JSON.stringify(obrasVistas));
                            updateChecklistUI();
                        }
                    }

                    function updateChecklistUI() {
                        const trigger = document.getElementById('checklist-trigger');
                        const progress = document.getElementById('checklist-progress');
                        const itemsContainer = document.getElementById('checklist-items');
                        
                        trigger.textContent = `Ver Progresso (${obrasVistas.length}/${totalObras})`;
                        
                        if (totalObras > 0 && obrasVistas.length === totalObras) {
                            trigger.classList.add('completou');
                            trigger.textContent = "✓ Todas as Telas Vistas!";
                        } else {
                            trigger.classList.remove('completou');
                        }

                        const porcentagem = totalObras > 0 ? Math.round((obrasVistas.length / totalObras) * 100) : 0;
                        progress.textContent = `${porcentagem}% Completo`;
                        
                        itemsContainer.innerHTML = '';
                        listaObras.forEach(obra => {
                            const vista = obrasVistas.includes(parseInt(obra.id));
                            const li = document.createElement('li');
                            li.className = `checklist-item ${vista ? 'visto' : ''}`;
                            li.innerHTML = `
                                <input type="checkbox" ${vista ? 'checked' : ''}>
                                <span>Tela ${obra.id}: ${obra.titulo}</span>
                            `;
                            itemsContainer.appendChild(li);
                        });
                    }

                    document.getElementById('checklist-trigger').onclick = () => {
                        document.getElementById('checklist-panel').classList.toggle('active');
                    };

                    initChecklist();

                    document.addEventListener('mouseenter', function (evt) {
                        if (evt.target.classList && evt.target.classList.contains('interactable')) {
                            const titulo = evt.target.getAttribute('data-titulo');
                            const autor = evt.target.getAttribute('data-autor');

                            hudTitle.textContent = titulo;
                            hudAuthor.textContent = autor;
                            hud.style.display = 'block';

                            // Feedback visual no cursor
                            document.getElementById('cursor').setAttribute('color', '#ffcc00');
                            document.getElementById('cursor').setAttribute('scale', '0.8 0.8 0.8');
                        }
                    }, true);

                    document.addEventListener('mouseleave', function (evt) {
                        if (evt.target.classList && evt.target.classList.contains('interactable')) {
                            hud.style.display = 'none';

                            // Volta cursor ao normal
                            document.getElementById('cursor').setAttribute('color', '#fff');
                            document.getElementById('cursor').setAttribute('scale', '0.5 0.5 0.5');
                        }
                    }, true);

                    document.addEventListener('click', function (evt) {
                        if (evt.target.classList && evt.target.classList.contains('interactable')) {
                            const numero = evt.target.getAttribute('data-numero');
                            const titulo = evt.target.getAttribute('data-titulo');
                            const autor = evt.target.getAttribute('data-autor');
                            const tecnica = evt.target.getAttribute('data-tecnica');

                            overlayImg.src = `tela${numero}.jpg`;
                            overlayTitle.textContent = titulo;
                            overlayAuthor.textContent = autor;
                            overlayTech.textContent = tecnica;

                            marcarComoVista(numero);

                            overlay.classList.add('active');

                            // Entrar em tela cheia se possível
                            if (document.documentElement.requestFullscreen) {
                                document.documentElement.requestFullscreen();
                            } else if (document.documentElement.mozRequestFullScreen) {
                                document.documentElement.mozRequestFullScreen();
                            } else if (document.documentElement.webkitRequestFullscreen) {
                                document.documentElement.webkitRequestFullscreen();
                            } else if (document.documentElement.msRequestFullscreen) {
                                document.documentElement.msRequestFullscreen();
                            }
                        }
                    }, true);

                    function fecharOverlay() {
                        overlay.classList.remove('active');
                        // Sair da tela cheia se estiver nela
                        if (document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement) {
                            if (document.exitFullscreen) {
                                document.exitFullscreen();
                            } else if (document.mozCancelFullScreen) {
                                document.mozCancelFullScreen();
                            } else if (document.webkitExitFullscreen) {
                                document.webkitExitFullscreen();
                            } else if (document.msExitFullscreen) {
                                document.msExitFullscreen();
                            }
                        }
                    }

                    closeOverlay.addEventListener('click', fecharOverlay);

                    // Fechar overlay com ESC
                    window.addEventListener('keydown', function(e) {
                        if (e.key === 'Escape') {
                            fecharOverlay();
                        }
                    });

                    /* =================================================
                       MOVIMENTAÇÃO

                       A altura NÃO muda.
                       ================================================= */

                    const velocidade =
                        0.075;



                    function movimentar() {


                        /*
                         * Verificação de segurança.
                         */

                        if (!player) {

                            return;

                        }


                        /*
                         * Posição atual.
                         */

                        const pos =
                            player.getAttribute(
                                "position"
                            );


                        if (!pos) {

                            return;

                        }


                        /*
                         * Suavização da rotação.
                         */

                        const diff =
                            targetRotation -
                            currentRotation;


                        if (
                            Math.abs(
                                diff
                            ) > 0.1
                        ) {

                            currentRotation +=
                                diff *
                                0.15; // Velocidade de rotação levemente aumentada

                        } else {

                            currentRotation =
                                targetRotation;
                            isRotating = false; // Permite novo comando de rotação

                        }


                        player.setAttribute(
                            "rotation",
                            `0 ${currentRotation} 0`
                        );




                        /* =============================================
                           FRENTE / TRÁS
                           ============================================= */

                        // No "trilho", o movimento é frontal baseado na orientação atual.
                        // W/ArrowUp sempre move para onde o jogador está olhando.

                        if (
                            teclas["w"] ||
                            teclas["arrowup"]
                        ) {

                            const rad =
                                (currentRotation *
                                    Math.PI) /
                                180;
                            pos.x -=
                                Math.sin(rad) *
                                velocidade;
                            pos.z -=
                                Math.cos(rad) *
                                velocidade;

                        }



                        /* =============================================
                           LIMITES LATERAIS E TRILHO
                           ============================================= */

                        // Mantemos o jogador no centro do corredor (trilho),
                        // EXCETO na zona de fundo (Z <= -105) onde há o tapete em T.
                        if (pos.z > -105) {
                            pos.x = 0;
                        } else {
                            // Limites laterais na zona de fundo (tapete transversal)
                            if (pos.x < -3) pos.x = -3;
                            if (pos.x > 3) pos.x = 3;
                        }



                        /* =============================================
                           LIMITES DO CORREDOR
                           ============================================= */

                        if (
                            pos.z >
                            4
                        ) {

                            pos.z =
                                4;

                        }


                        if (
                            pos.z <
                            posFundoZ
                        ) {

                            pos.z =
                                posFundoZ;

                        }



                        /* =============================================
                           ALTURA FIXA
                           ============================================= */

                        pos.y =
                            1.7;



                        /*
                         * Atualiza posição.
                         */

                        player.setAttribute(
                            "position",
                            pos
                        );


                        /*
                         * Próximo frame.
                         */

                        requestAnimationFrame(
                            movimentar
                        );

                    }



                    /*
                     * Começa movimento.
                     */

                    movimentar();



                    /* =================================================
                       FINALIZA CARREGAMENTO
                       ================================================= */

                    const loading =
                        document.getElementById(
                            "loading"
                        );


                    if (loading) {

                        loading.style.opacity =
                            "0";


                        setTimeout(
                            function () {

                                loading.style.display =
                                    "none";

                            },
                            700
                        );

                    }


                    console.log(
                        "Museu Virtual V2.1 iniciado."
                    );


                    console.log(
                        "18 quadros configurados."
                    );

                }
            );



            /* =================================================
               ERROS DE IMAGEM
               ================================================= */

            window.addEventListener(
                "error",
                function (event) {

                    if (
                        event.target &&
                        event.target.tagName ===
                        "IMG"
                    ) {

                        console.warn(
                            "Imagem não encontrada:",
                            event.target.src
                        );

                    }

                },
                true
            );

        }
    );

</script>
