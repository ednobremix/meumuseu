<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Museu Virtual 3D</title>


    <!-- =====================================================
         A-FRAME
         ===================================================== -->

    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>


    <!-- =====================================================
         ESTILO DA INTERFACE
         ===================================================== -->

    <style>

        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #111;

            font-family:
                    Arial,
                    Helvetica,
                    sans-serif;

            touch-action: manipulation;
        }


        /* =================================================
           TELA DE CARREGAMENTO
           ================================================= */

        #loading {

            position: fixed;

            inset: 0;

            z-index: 99999;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            background:
                    radial-gradient(
                            circle,
                            #34302b 0%,
                            #181614 65%,
                            #0c0b0a 100%
                    );

            color: white;

            transition:
                    opacity 0.7s ease;

        }


        #loading h1 {

            margin: 0 0 15px;

            font-size: 32px;

            font-weight: 300;

            letter-spacing: 7px;

        }


        #loading p {

            margin: 0;

            color: #c8c0b7;

            font-size: 14px;

            letter-spacing: 1px;

        }


        /* =================================================
           TÍTULO DO MUSEU
           ================================================= */

        #museum-title {

            position: fixed;

            top: 18px;

            left: 50%;

            transform:
                    translateX(-50%);

            z-index: 1000;

            padding:
                    9px 20px;

            background:
                    rgba(
                            20,
                            18,
                            16,
                            0.70
                    );

            border:
                    1px solid
                    rgba(
                            255,
                            255,
                            255,
                            0.12
                    );

            border-radius: 4px;

            color: white;

            font-size: 13px;

            letter-spacing: 4px;

            pointer-events: none;

        }


        /* =================================================
           INSTRUÇÕES
           ================================================= */

        #instructions {

            position: fixed;

            left: 18px;

            bottom: 18px;

            z-index: 1000;

            padding:
                    12px 16px;

            background:
                    rgba(
                            20,
                            18,
                            16,
                            0.78
                    );

            border-radius: 6px;

            color: #eee;

            font-size: 13px;

            line-height: 1.7;

            pointer-events: none;

        }


        #instructions strong {

            color: white;

            letter-spacing: 1px;

        }


        /* =================================================
           OVERLAY DE TELA CHEIA
           ================================================= */

        #overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 200000;
            background: rgba(0, 0, 0, 0.98);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: white;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        #overlay.active {
            display: flex;
            opacity: 1;
        }

        #overlay img {
            max-width: 90vw;
            max-height: 75vh;
            border: 3px solid #d9d5ce;
            box-shadow: 0 0 60px rgba(0,0,0,0.8);
            margin-bottom: 25px;
            object-fit: contain;
        }


        #overlay-info {
            text-align: center;
            max-width: 800px;
        }

        #overlay-title {
            font-size: 28px;
            margin: 0 0 10px;
            letter-spacing: 2px;
            color: #d9d5ce;
        }

        #overlay-author {
            font-size: 18px;
            margin: 0 0 20px;
            color: #aaa;
            font-style: italic;
        }

        #close-overlay {
            position: absolute;
            top: 30px;
            right: 40px;
            font-size: 40px;
            cursor: pointer;
            color: #fff;
            background: none;
            border: none;
            padding: 10px;
        }

        #close-overlay:hover {
            color: #d9d5ce;
        }

        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            font-size: 60px;
            padding: 20px;
            cursor: pointer;
            z-index: 200001;
            transition: background 0.3s;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 80px;
            height: 120px;
            user-select: none;
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        #overlay-prev {
            left: 20px;
        }

        #overlay-next {
            right: 20px;
        }

        @media (max-width: 768px) {
            .nav-btn {
                font-size: 40px;
                width: 50px;
                height: 80px;
                padding: 10px;
            }
            #overlay-prev { left: 5px; }
            #overlay-next { right: 5px; }
        }

        /* CHECKLIST DE OBRAS VISUALIZADAS */
        #checklist-trigger {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 150000;
            background: rgba(24, 22, 20, 0.85);
            color: white;
            border: 1px solid #76554a;
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        #checklist-trigger:hover {
            background: #76554a;
        }

        #checklist-trigger.completou {
            background: #4caf50;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(76, 175, 80, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(76, 175, 80, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(76, 175, 80, 0); }
        }

        #checklist-panel {
            position: fixed;
            top: 70px;
            right: 20px;
            width: 300px;
            max-height: 80vh;
            background: rgba(24, 22, 20, 0.95);
            border: 1px solid #76554a;
            z-index: 150000;
            display: none;
            flex-direction: column;
            padding: 20px;
            color: white;
            border-radius: 4px;
            overflow-y: auto;
        }

        #checklist-panel.active {
            display: flex;
        }

        #checklist-panel h3 {
            margin: 0 0 15px 0;
            font-size: 20px;
            border-bottom: 1px solid #76554a;
            padding-bottom: 10px;
            text-align: center;
        }

        #checklist-items {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .checklist-item {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            font-size: 14px;
            padding: 5px;
            border-bottom: 1px solid #333;
        }

        .checklist-item.visto {
            color: #4caf50;
            text-decoration: line-through;
            opacity: 0.7;
        }

        .checklist-item input {
            margin-right: 10px;
            pointer-events: none;
        }

        #checklist-progress {
            margin-bottom: 15px;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            color: #ffcc00;
        }

        /* HUD DE INFORMAÇÃO AO FOCAR */
        #hud-info {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100000;
            background: rgba(24, 22, 20, 0.85);
            padding: 15px 30px;
            border: 1px solid #76554a;
            border-radius: 4px;
            text-align: center;
            pointer-events: none;
            display: none;
            min-width: 250px;
        }

        #hud-info h2 {
            margin: 0;
            font-size: 18px;
            letter-spacing: 1px;
            color: #f1ede8;
        }

        #hud-info p {
            margin: 5px 0 0;
            font-size: 13px;
            color: #c8c0b7;
        }

        /* CONTROLES MOBILE */
        #mobile-controls {
            display: none;
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 100000;
            width: 150px;
            height: 150px;
            pointer-events: none; /* Deixa cliques passarem pelo container */
            touch-action: none;
        }

        .mobile-btn {
            position: absolute;
            width: 50px;
            height: 50px;
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 24px;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            transition: all 0.2s;
            pointer-events: auto; /* Reabilita para os botões */
            touch-action: manipulation;
        }

        .mobile-btn:active {
            background: rgba(255, 255, 255, 0.6);
            transform: scale(1.1);
        }

        #btn-up { top: 0; left: 50px; }
        #btn-down { bottom: 0; left: 50px; }
        #btn-left { top: 50px; left: 0; }
        #btn-right { top: 50px; right: 0; }

        @media (max-width: 768px) {
            #mobile-controls {
                display: block;
            }
            #instructions {
                display: none;
            }
        }


        /* =================================================
           AVISO DE ERRO
           ================================================= */

        #error {

            display: none;

            position: fixed;

            left: 50%;

            top: 50%;

            transform:
                    translate(
                            -50%,
                            -50%
                    );

            z-index: 100000;

            width:
                    min(
                            500px,
                            85vw
                    );

            padding: 25px;

            background: #251d1a;

            color: white;

            border:
                    1px solid
                    #76554a;

            border-radius: 8px;

            text-align: center;

        }

    </style>

</head>


<body>


<!-- =====================================================
     INTERFACE
     ===================================================== -->

<div id="loading">

    <h1>MUSEU M.A.NOBRE</h1>

    <p>
        Preparando a exposição...
    </p>

</div>


<div id="museum-title">

    MUSEU MANUEL A NOBRE
</div>


<div id="instructions">

    <strong>VISITA VIRTUAL</strong><br>

    W A S D ou setas — caminhar<br>
    Clique na obra — destaque<br>

</div>


<div id="error"></div>


<!-- OVERLAY PARA TELA CHEIA -->
<div id="overlay">
    <button id="close-overlay">&times;</button>
    <img id="overlay-img" src="" alt="Obra em tela cheia">
    <div id="overlay-info">
        <h2 id="overlay-title">Título da Obra</h2>
        <p id="overlay-author">Autor da Obra</p>
        <p id="overlay-tech" style="font-size: 16px; color: #888; margin-top: -10px;">Técnica</p>
    </div>
    <button id="overlay-prev" class="nav-btn">&lsaquo;</button>
    <button id="overlay-next" class="nav-btn">&rsaquo;</button>
</div>

<!-- SISTEMA DE CHECKLIST -->
<div id="checklist-trigger">Ver Progresso (0/0)</div>
<div id="checklist-panel">
    <h3>Sua Coleção</h3>
    <div id="checklist-progress">0% Completo</div>
    <ul id="checklist-items">
        <!-- Itens preenchidos via JS -->
    </ul>
</div>

<!-- HUD DE INFORMAÇÃO -->
<div id="hud-info">
    <h2 id="hud-title">Título</h2>
    <p id="hud-author">Autor</p>
</div>

<!-- CONTROLES MOBILE -->
<div id="mobile-controls">
    <div id="btn-up" class="mobile-btn">▲</div>
    <div id="btn-down" class="mobile-btn">▼</div>
    <div id="btn-left" class="mobile-btn">◀</div>
    <div id="btn-right" class="mobile-btn">▶</div>
</div>



<!-- =====================================================
     MUSEU 3D
     ===================================================== -->

<a-scene

        embedded

            colorManagement: true;
            physicallyCorrectLights: true
        "
        fog="
            type: linear;
            color: #d9d5ce;
            near: 30;
            far: 70
        "
>

    <!-- =================================================
         LUZ AMBIENTE
         ================================================= -->

    <a-light
            type="ambient"
            color="#fff4df"
            intensity="1.2"
    ></a-light>



    <!-- =================================================
         PISO
         ================================================= -->

    <a-plane
            position="0 0.02 -60"
            rotation="-90 0 0"
            width="18"
            height="130"
            color="#dcdcdc"
            material="
                roughness: 0.7;
                metalness: 0.2;
                src: url(https://cdn.aframe.io/a-painter/images/floor.jpg);
                repeat: 20 100
            "
    ></a-plane>



    <!-- =================================================
         TETO
         ================================================= -->

    <a-plane
            position="0 8.75 -60"
            rotation="90 0 0"
            width="18"
            height="130"
            color="#eeeae3"
    ></a-plane>



    <!-- =================================================
         PAREDES LATERAIS
         ================================================= -->

    <!-- Parede esquerda -->

    <a-box
            position="-9 4.375 -60"
            width="0.25"
            height="8.75"
            depth="130"
            color="#e5e1da"
    ></a-box>


    <!-- Parede direita -->

    <a-box
            position="9 4.375 -60"
            width="0.25"
            height="8.75"
            depth="130"
            color="#e5e1da"
    ></a-box>



    <!-- =================================================
         PAREDES DIVISÓRIAS REMOVIDAS
         ================================================= -->



    <!-- =================================================
         PAREDE DO FUNDO
         ================================================= -->

    <a-box
            position="0 4.375 -125"
            width="18"
            height="8.75"
            depth="0.25"
            color="#e5e1da"
            material="roughness: 1; metalness: 0"
    ></a-box>

    <!-- Tapete Vermelho no centro (Corredor) -->
    <a-plane
            position="0 0.03 -58.5"
            rotation="-90 0 0"
            width="4"
            height="117"
            color="#700"
            material="roughness: 1"
    ></a-plane>

    <!-- Tapete Vermelho no fundo (T transversal) -->
    <a-plane
            position="0 0.03 -119.5"
            rotation="-90 0 0"
            width="12"
            height="5"
            color="#700"
            material="roughness: 1"
    ></a-plane>



    <!-- =================================================
         ENTRADA (PAREDE E LAYOUT)
         ================================================= -->

    <!-- Parede Frontal Esquerda (Externa) -->
    <a-box
            position="-8 4.375 3"
            width="4.0"
            height="8.75"
            depth="0.25"
            color="#f0ede9"
    ></a-box>

    <!-- Parede Frontal Direita (Externa) -->
    <a-box
            position="8 4.375 3"
            width="4.0"
            height="8.75"
            depth="0.25"
            color="#f0ede9"
    ></a-box>

    <!-- Colunas Laterais Largas (Conforme Foto) -->
    <a-box
            position="-5 4.375 3"
            width="2.0"
            height="8.75"
            depth="0.6"
            color="#f0ede9"
    ></a-box>
    <a-box
            position="5 4.375 3"
            width="2.0"
            height="8.75"
            depth="0.6"
            color="#f0ede9"
    ></a-box>

    <!-- Paredes Chanfradas (45 graus) -->
    <a-box
            position="-3.3 4.375 2.3"
            rotation="0 45 0"
            width="2.0"
            height="8.75"
            depth="0.25"
            color="#e5e1da"
    ></a-box>
    <a-box
            position="3.3 4.375 2.3"
            rotation="0 -45 0"
            width="2.0"
            height="8.75"
            depth="0.25"
            color="#e5e1da"
    ></a-box>

    <!-- Viga Superior da Entrada -->
    <a-box
            position="0 7.375 3"
            width="8.0"
            height="2.75"
            depth="0.25"
            color="#f0ede9"
    ></a-box>

    <!-- Viga Escura do Nome (Conforme Imagem) -->
    <a-box
            position="0 6.6 3.3"
            width="8.0"
            height="1.4"
            depth="0.1"
            color="#1a1714"
    ></a-box>

    <!-- Texto na Viga removido (agora nas portas) -->

    <a-text
            value="MUSEU MANUEL A NOBRE"
            position="0 6.6 3.36"

            color="#d4af37"
            width="7"

            letter-spacing="15"
    ></a-text>

    <!-- Portas de Vidro Abertas -->
    <a-entity position="-2 0 1.6" rotation="0 80 0">
        <!-- Moldura da Porta -->
        <a-box width="2.1" height="6.1" depth="0.1" position="1 3.05 0" color="#3d2b1f" material="roughness: 0.8; metalness: 0.2; src: url(https://cdn.aframe.io/a-painter/images/floor.jpg); repeat: 1 3"></a-box>
        <!-- Texto na Porta (Esquerda) -->
        <a-text value="MUSEU" position="1 4 0.06" align="center" color="#d4af37" width="6" font="https://cdn.aframe.io/fonts/Exo2Bold.fnt"></a-text>
        <a-text value="MANUEL" position="1 3 0.06" align="center" color="#d4af37" width="5" font="https://cdn.aframe.io/fonts/Exo2Bold.fnt"></a-text>
        
        <a-box width="0.1" height="6.1" depth="0.15" position="0 3.05 0" color="#1a1714"></a-box>
        <a-box width="0.1" height="6.1" depth="0.15" position="2 3.05 0" color="#1a1714"></a-box>
        <a-box width="2.1" height="0.1" depth="0.15" position="1 6.1 0" color="#1a1714"></a-box>
        <a-box width="2.1" height="0.1" depth="0.15" position="1 0 0" color="#1a1714"></a-box>
        <!-- Puxador -->
        <a-cylinder radius="0.02" height="1.5" position="1.8 1.5 0.1" color="#1a1714"></a-cylinder>
    </a-entity>

    <a-entity position="2 0 1.6" rotation="0 -80 0">
        <!-- Moldura da Porta -->
        <a-box width="2.1" height="6.1" depth="0.1" position="-1 3.05 0" color="#3d2b1f" material="roughness: 0.8; metalness: 0.2; src: url(https://cdn.aframe.io/a-painter/images/floor.jpg); repeat: 1 3"></a-box>
        <!-- Texto na Porta (Direita) -->
        <a-text value="A" position="-1 4 0.06" align="center" color="#d4af37" width="8" font="https://cdn.aframe.io/fonts/Exo2Bold.fnt"></a-text>
        <a-text value="NOBRE" position="-1 3 0.06" align="center" color="#d4af37" width="6" font="https://cdn.aframe.io/fonts/Exo2Bold.fnt"></a-text>
        
        <a-box width="0.1" height="6.1" depth="0.15" position="0 3.05 0" color="#1a1714"></a-box>
        <a-box width="0.1" height="6.1" depth="0.15" position="-2 3.05 0" color="#1a1714"></a-box>
        <a-box width="2.1" height="0.1" depth="0.15" position="-1 6.1 0" color="#1a1714"></a-box>
        <a-box width="2.1" height="0.1" depth="0.15" position="-1 0 0" color="#1a1714"></a-box>
        <!-- Puxador -->
        <a-cylinder radius="0.02" height="1.5" position="-1.8 1.5 0.1" color="#1a1714"></a-cylinder>
    </a-entity>

    <!-- Tapete Vermelho (Entrada) -->
    <a-plane
            position="0 0.05 5"
            rotation="-90 0 0"
            width="3.2"
            height="12"
            color="#9e1b1b"
            material="roughness: 0.9"
    ></a-plane>

    <!-- Vasos de Plantas (Decorativos - Fino e Elegante) -->
    <a-entity position="-3.5 0 3.8">
        <!-- Vaso Cônico Invertido -->
        <a-cone radius-bottom="0.25" radius-top="0.45" height="2.2" color="#1a1a1a" position="0 1.1 0"></a-cone>

<!-- =====================================================

<script>

    document.addEventListener(
        "DOMContentLoaded",
        function () {


            /* =================================================
               PEGA A CENA
               ================================================= */

            const scene =
                document.querySelector(
                    "#museum"
                );


            if (!scene) {

                console.error(
                    "ERRO: A-Frame não encontrado."
                );

                return;

            }



            /* =================================================
               ESPERA O A-FRAME TERMINAR
               ================================================= */

            function finalizarCarregamento() {
                const loading = document.getElementById("loading");
                if (loading) {
                    loading.style.opacity = "0";
                    setTimeout(function () {
                        loading.style.display = "none";
                    }, 700);
                }
            }

            // Fallback de segurança: se em 10 segundos não carregar, remove o loading
            setTimeout(finalizarCarregamento, 10000);

            if (scene.hasLoaded) {
                configurarMuseu();
            } else {
                scene.addEventListener("loaded", configurarMuseu);
            }

            function configurarMuseu() {
                console.log("Museu carregado.");



                    /* =========================================
                       PLAYER
                       ========================================= */

                    const player =
                        document.querySelector(
                            "#player"
                        );


                    const camera =
                        document.querySelector(
                            "#camera"
                        );


                    if (!player) {

                        console.error(
                            "ERRO: #player não encontrado."
                        );

                        return;

                    }


                    if (!camera) {

                        console.error(
                            "ERRO: #camera não encontrada."
                        );

                        return;

                    }



                    /* =========================================
                       DADOS DAS OBRAS
                       ========================================= */

                    let obras = [];
                    const definicoesQuadros = [];
                    const quadrosCriados = new Set();

                    async function carregarObras() {
                        try {
                            const resp = await fetch('obras.json');
                            if (resp.ok) {
                                obras = await resp.json();
                                inicializarDefinicoesQuadros();
                                // Não chamamos mais inicializarQuadros() aqui, 
                                // a função verificarCarregamentoProgressivo fará o trabalho.
                            }
                        } catch (err) {
                            console.error("Erro ao carregar obras:", err);
                        }
                    }

                    function inicializarDefinicoesQuadros() {
                        const defs = [
                            // Sala 1
                            { num: 1, lado: "esquerda", x: -8.82, z: -4 },
                            { num: 2, lado: "esquerda", x: -8.82, z: -11 },
                            { num: 3, lado: "direita", x: 8.82, z: -4 },
                            { num: 4, lado: "direita", x: 8.82, z: -11 },
                            // Sala 2
                            { num: 5, lado: "esquerda", x: -8.82, z: -19 },
                            { num: 6, lado: "esquerda", x: -8.82, z: -26 },
                            { num: 7, lado: "direita", x: 8.82, z: -19 },
                            { num: 8, lado: "direita", x: 8.82, z: -26 },
                            // Sala 3
                            { num: 9, lado: "esquerda", x: -8.82, z: -34 },
                            { num: 10, lado: "esquerda", x: -8.82, z: -41 },
                            { num: 11, lado: "direita", x: 8.82, z: -34 },
                            { num: 12, lado: "direita", x: 8.82, z: -41 },
                            // Sala 4
                            { num: 13, lado: "esquerda", x: -8.82, z: -49 },
                            { num: 14, lado: "esquerda", x: -8.82, z: -56 },
                            { num: 15, lado: "direita", x: 8.82, z: -49 },
                            { num: 16, lado: "direita", x: 8.82, z: -56 },
                            // Sala 5
                            { num: 17, lado: "esquerda", x: -8.82, z: -64 },
                            { num: 18, lado: "esquerda", x: -8.82, z: -71 },
                            { num: 19, lado: "direita", x: 8.82, z: -64 },
                            { num: 20, lado: "direita", x: 8.82, z: -71 },
                            // Sala 6
                            { num: 21, lado: "esquerda", x: -8.82, z: -78.22 },
                            { num: 22, lado: "esquerda", x: -8.82, z: -86 },
                            { num: 23, lado: "direita", x: 8.82, z: -77.44 },
                            { num: 24, lado: "direita", x: 8.82, z: -86 },
                            // Sala 7
                            { num: 25, lado: "esquerda", x: -8.82, z: -94 },
                            { num: 26, lado: "esquerda", x: -8.82, z: -102.3 },
                            { num: 27, lado: "direita", x: 8.82, z: -94 },
                            { num: 28, lado: "direita", x: 8.82, z: -101 },
                            // Sala 8
                            { num: 29, lado: "esquerda", x: -8.82, z: -109 },
                            { num: 30, lado: "esquerda", x: -8.82, z: -116 },
                            { num: 31, lado: "direita", x: 8.82, z: -109 },
                            { num: 32, lado: "direita", x: 8.82, z: -116 },
                            // Sala 9
                            { num: 33, lado: "fundo", x: 0, z: -124.82 }
                        ];
                        definicoesQuadros.push(...defs);
                    }

                    function verificarCarregamentoProgressivo(posZ) {
                        // Distância de visualização: 3 linhas (salas) para frente.
                        // Cada sala tem ~15 unidades. 3 salas = ~45 unidades.
                        // Consideramos carregado tudo que estiver entre [posZ - 50, posZ + 20]
                        // (Z diminui conforme andamos para o fundo do museu)
                        const margemFrente = 50;
                        const margemTras = 20;

                        definicoesQuadros.forEach(def => {
                            if (!quadrosCriados.has(def.num)) {
                                // O player começa em Z=4. Conforme anda, Z vai para -120.
                                // Um quadro em Z=-20 deve carregar quando o player chegar em Z = -20 + 50 = 30.
                                if (def.z >= posZ - margemFrente && def.z <= posZ + margemTras) {
                                    criarQuadro(def.num, def.lado, def.x, def.z);
                                    quadrosCriados.add(def.num);
                                }
                            }
                        });
                    }

                    carregarObras();



                    /* =================================================
                       CRIA QUADRO
                       ================================================= */

                    function criarQuadro(
                        numero,
                        lado,
                        x,
                        z
                    ) {


                        const obra =
                            obras[
                            numero - 1
                                ];


                        const grupo =
                            document.createElement(
                                "a-entity"
                            );


                        /*
                         * TODOS OS QUADROS:
                         *
                         * mesma altura
                         * mesma dimensão
                         */

                        grupo.setAttribute(
                            "position",
                            `${x} 4.2 ${z}`
                        );


                        if (
                            lado === "esquerda"
                        ) {


                            grupo.setAttribute(
                                "rotation",
                                "0 90 0"
                            );


                        } else if (
                            lado === "direita"
                        ) {


                            grupo.setAttribute(
                                "rotation",
                                "0 -90 0"
                            );


                        } else if (
                            lado === "fundo"
                        ) {


                            grupo.setAttribute(
                                "rotation",
                                "0 0 0"
                            );

                            if (numero === 33) {
                                grupo.setAttribute(
                                    "position",
                                    "0 4.2 -124.82"
                                );
                            }


                        }

                        /* =============================================
                           MOLDURA EXTERNA (Madeira)
                           ============================================= */

                        const molduraExterna =
                            document.createElement(
                                "a-box"
                            );

                        molduraExterna.setAttribute(
                            "width",
                            "5.2"
                        );

                        molduraExterna.setAttribute(
                            "height",
                            "4.1"
                        );

                        molduraExterna.setAttribute(
                            "depth",
                            "0.2"
                        );

                        molduraExterna.setAttribute(
                            "color",
                            "#3d2b1f" // Marrom madeira escuro
                        );

                        // Torna a moldura clicável
                        molduraExterna.classList.add("interactable");
                        molduraExterna.setAttribute("data-numero", numero);
                        molduraExterna.setAttribute("data-lado", lado);
                        molduraExterna.setAttribute("data-titulo", obra.titulo);
                        molduraExterna.setAttribute("data-autor", obra.autor);
                        molduraExterna.setAttribute("data-tecnica", obra.tecnica);

                        grupo.appendChild(
                            molduraExterna
                        );

                        /* =============================================
                           MOLDURA INTERNA / PASSE-PARTOUT
                           ============================================= */

                        const passePartout =
                            document.createElement(
                                "a-box"
                            );

                        passePartout.setAttribute(
                            "width",
                            "4.6"
                        );

                        passePartout.setAttribute(
                            "height",
                            "3.5"
                        );

                        passePartout.setAttribute(
                            "depth",
                            "0.1"
                        );

                        passePartout.setAttribute(
                            "position",
                            "0 0 0.05"
                        );

                        passePartout.setAttribute(
                            "color",
                            "#f5f5dc" // Bege / Off-white
                        );

                        // Torna o passe-partout clicável
                        passePartout.classList.add("interactable");
                        passePartout.setAttribute("data-numero", numero);
                        passePartout.setAttribute("data-lado", lado);
                        passePartout.setAttribute("data-titulo", obra.titulo);
                        passePartout.setAttribute("data-autor", obra.autor);
                        passePartout.setAttribute("data-tecnica", obra.tecnica);

                        grupo.appendChild(
                            passePartout
                        );

                        /* =============================================
                           IMAGEM (A tela propriamente dita)
                           ============================================= */

                        const imagem =
                            document.createElement(
                                "a-plane"
                            );

                        // Dimensões máximas permitidas para a imagem dentro do passe-partout (aumentadas em 70%)
                        let MAX_WIDTH = 4.35 * 1.7;
                        let MAX_HEIGHT = 3.25 * 1.7;

                        // Inicializa com dimensões máximas (evita que o plano fique invisível antes de carregar)
                        imagem.setAttribute("width", MAX_WIDTH);
                        imagem.setAttribute("height", MAX_HEIGHT);

                        /*
                         * Ajusta a proporção da imagem e das molduras assim que ela carregar
                         */
                        const imgAsset = document.querySelector(`#tela${numero}`);
                        if (imgAsset) {
                            const ajustarDimensoes = () => {
                                const w = imgAsset.naturalWidth;
                                const h = imgAsset.naturalHeight;
                                if (w && h) {
                                    const proporcaoImagem = w / h;
                                    const proporcaoContainer = MAX_WIDTH / MAX_HEIGHT;

                                    let finalWidth, finalHeight;

                                    if (proporcaoImagem > proporcaoContainer) {
                                        // Mais larga que o container (Paisagem extrema)
                                        finalWidth = MAX_WIDTH;
                                        finalHeight = MAX_WIDTH / proporcaoImagem;
                                    } else {
                                        // Mais alta que o container (Retrato ou Paisagem leve)
                                        finalHeight = MAX_HEIGHT;
                                        finalWidth = MAX_HEIGHT * proporcaoImagem;
                                    }

                                    // Aplica as dimensões na imagem
                                    imagem.setAttribute("width", finalWidth);
                                    imagem.setAttribute("height", finalHeight);

                                    // Ajusta o Passe-Partout (margem de ~0.15 em cada lado)
                                    passePartout.setAttribute("width", finalWidth + 0.25);
                                    passePartout.setAttribute("height", finalHeight + 0.25);

                        // Ajusta a Moldura Externa (margem maior para quadros maiores)
                                    molduraExterna.setAttribute("width", finalWidth + 1.2);
                                    molduraExterna.setAttribute("height", finalHeight + 1.2);
                                }
                            };

                            if (imgAsset.complete) {
                                ajustarDimensoes();
                            } else {
                                imgAsset.addEventListener("load", ajustarDimensoes);
                            }
                        }

                        /*
                         * A imagem fica ligeiramente à frente do passe-partout
                         */

                        imagem.setAttribute(
                            "position",
                            "0 0 0.11"
                        );


                        imagem.setAttribute(
                            "material",
                            `src: #tela${numero}; side: double; roughness: 0.5; metalness: 0.1; shader: standard`
                        );

                        // Adiciona classes e dados para interação
                        imagem.classList.add("interactable");
                        imagem.setAttribute("data-numero", numero);
                        imagem.setAttribute("data-lado", lado);
                        imagem.setAttribute("data-titulo", obra.titulo);
                        imagem.setAttribute("data-autor", obra.autor);
                        imagem.setAttribute("data-tecnica", obra.tecnica);

                        grupo.appendChild(
                            imagem
                        );



                        /* =============================================
                          QUADRO NA CENA
                          ============================================= */

                        scene.appendChild(
                            grupo
                        );

                    }









                    /* =================================================
                       TECLADO
                       ================================================= */

                    const teclas = {};
                    let targetRotation = 0;
                    let currentRotation = 0;
                    let isRotating = false;

                    // Coordenadas Z dos quadros laterais para centralização
                    const quadrosZ = [
                        -4, -11,       // Sala 1
                        -19, -26,      // Sala 2
                        -34, -41,      // Sala 3
                        -49, -56,      // Sala 4
                        -64, -71,      // Sala 5
                        -79, -86,      // Sala 6
                        -94, -101,     // Sala 7
                        -109, -116     // Sala 8
                    ];
                    const posFundoZ = -121;
                    const limiteFundoZ = -120;

                    function navegarEntreQuadros(direcao) {
                        const pos = player.getAttribute("position");
                        if (!pos) return false;

                        // Encontrar o índice do quadro mais próximo
                        let currentIndex = 0;
                        let minDiff = Math.abs(pos.z - quadrosZ[0]);

                        for (let i = 1; i < quadrosZ.length; i++) {
                            let diff = Math.abs(pos.z - quadrosZ[i]);
                            if (diff < minDiff) {
                                minDiff = diff;
                                currentIndex = i;
                            }
                        }

                                // Mover para o próximo ou anterior SOMENTE se estiver na mesma sala
                                let nextIndex = currentIndex + direcao;
                                
                                // Verifica se o próximo índice está dentro dos limites do array
                                if (nextIndex >= 0 && nextIndex < quadrosZ.length) {
                                    // Verifica se pertencem à mesma sala (S1-S8, todas com 2 posições Z)
                                    const salaAtual = Math.floor(currentIndex / 2);
                                    const salaProxima = Math.floor(nextIndex / 2);
                                    
                                    if (salaAtual === salaProxima) {
                                        pos.z = quadrosZ[nextIndex];
                                        player.setAttribute("position", pos);
                                        return true; // Navegou com sucesso
                                    }
                                }
                        return false; // Não há mais quadros nesta sala
                    }

                    function centralizarNoQuadro() {
                        const pos = player.getAttribute("position");
                        if (!pos) return;

                        let nearestZ = quadrosZ[0];
                        let minDiff = Math.abs(pos.z - quadrosZ[0]);

                        for (let i = 1; i < quadrosZ.length; i++) {
                            let diff = Math.abs(pos.z - quadrosZ[i]);
                            if (diff < minDiff) {
                                minDiff = diff;
                                nearestZ = quadrosZ[i];
                            }
                        }

                        pos.z = nearestZ;
                        player.setAttribute("position", pos);
                    }

                    function processarComando(key) {
                        // Rotação ou Navegação Lateral
                        if (!isRotating) {
                            let normalizedRot = ((targetRotation % 360) + 360) % 360;
                            const olhandoParaLado = Math.abs((targetRotation / 90) % 2) !== 0;
                            const olhandoParaFrente = Math.abs(normalizedRot) < 1;
                            const olhandoParaTras = Math.abs(normalizedRot - 180) < 1;

                            if (olhandoParaLado) {
                                const pos = player.getAttribute("position");
                                let currentIndex = 0;
                                let minDiff = Math.abs(pos.z - quadrosZ[0]);
                                for (let i = 1; i < quadrosZ.length; i++) {
                                    let diff = Math.abs(pos.z - quadrosZ[i]);
                                    if (diff < minDiff) {
                                        minDiff = diff;
                                        currentIndex = i;
                                    }
                                }

                                // Mapeamento real dos IDs dos quadros baseado na parede e posição Z
                                const idsEsquerda = [1, 2, 5, 6, 9, 10, 13, 14, 17, 18, 21, 22, 25, 26, 29, 30];
                                const idsDireita = [3, 4, 7, 8, 11, 12, 15, 16, 19, 20, 23, 24, 27, 28, 31, 32];

                                let currentID = 0;
                                if (Math.abs(normalizedRot - 90) < 1) {
                                    currentID = idsEsquerda[currentIndex];
                                } else if (Math.abs(normalizedRot - 270) < 1) {
                                    currentID = idsDireita[currentIndex];
                                }

                                const isOdd = currentID % 2 !== 0;
                                const isEven = currentID % 2 === 0;

                                if (key === "a" || key === "arrowleft") {
                                    // Transição Especial: 31 (Direita) -> 32 (Direita)
                                    if (currentID === 31) {
                                        pos.z = quadrosZ[15]; // Z do quadro 32
                                        player.setAttribute("position", pos);
                                        return;
                                    }

                                    // Transição Especial: 32 (Direita) -> 33 (Fundo)
                                    if (currentID === 32) {
                                        targetRotation = 0; // Gira para frente
                                        isRotating = true;
                                        pos.z = posFundoZ; // Posição para ver o fundo
                                        pos.x = 0; // Alinha com o quadro 33
                                        player.setAttribute("position", pos);
                                        return;
                                    }

                                    // Tenta navegar lateralmente primeiro se estiver olhando para um lado
                                    // Isso cobre o pedido de 4->3 e também generaliza para outros pares
                                    let dirNav = (Math.abs(normalizedRot - 90) < 1) ? -1 : 1;
                                    if (navegarEntreQuadros(dirNav)) return;

                                    if (isOdd) {
                                        targetRotation += 90;
                                        isRotating = true;
                                        if (Math.abs(targetRotation / 90) % 2 !== 0) {
                                            centralizarNoQuadro();
                                        }
                                    } else if (isEven) {
                                        targetRotation += 90;
                                        isRotating = true;
                                        if (Math.abs(targetRotation / 90) % 2 !== 0) {
                                            centralizarNoQuadro();
                                        }
                                    }
                                } else if (key === "d" || key === "arrowright") {
                                    // Tenta navegar lateralmente primeiro se estiver olhando para um lado
                                    let dirNav = (Math.abs(normalizedRot - 90) < 1) ? 1 : -1;
                                    if (navegarEntreQuadros(dirNav)) return;

                                    // Transição Especial: 32 (Direita) -> 31 (Direita)
                                    if (currentID === 32) {
                                        pos.z = quadrosZ[14]; // Z do quadro 31
                                        player.setAttribute("position", pos);
                                        return;
                                    }

                                    // Transição Especial: 32 (Direita) -> 33 (Fundo)
                                    // Removido o atalho A -> 33 para o D, mas mantendo a lógica se necessário
                                    // Na verdade, o pedido original não falava de 32 -> Direita -> 33.
                                    // O pedido original para 32 foi: DIREITA VAI PRA 31.
                                    // O pedido original para 33 foi: DIREITA VAI PRA 23.

                                    if (isEven) {
                                        targetRotation -= 90;
                                        isRotating = true;
                                        if (Math.abs(targetRotation / 90) % 2 !== 0) {
                                            centralizarNoQuadro();
                                        }
                                    } else if (isOdd) {
                                        targetRotation -= 90;
                                        isRotating = true;
                                        if (Math.abs(targetRotation / 90) % 2 !== 0) {
                                            centralizarNoQuadro();
                                        }
                                    }
                                } else if (key === "s" || key === "arrowdown") {
                                    targetRotation += 180;
                                    isRotating = true;
                                }
                            } else if (olhandoParaFrente) {
                                const pos = player.getAttribute("position");

                                // Pular para frente da próxima tela (ao apertar W ou Seta para Cima)
                                if (key === "w" || key === "arrowup") {
                                    let nextZ = null;
                                    // Indo para o fundo (Z diminui)
                                    for (let i = 0; i < quadrosZ.length; i++) {
                                        if (quadrosZ[i] < pos.z - 0.5) {
                                            if (nextZ === null || quadrosZ[i] > nextZ) {
                                                nextZ = quadrosZ[i];
                                            }
                                        }
                                    }
                                    // Se não houver mais quadros laterais à frente, pular para o fundo
                                    if (nextZ === null && pos.z > posFundoZ) {
                                        nextZ = posFundoZ;
                                    }

                                    if (nextZ !== null) {
                                        pos.z = nextZ;
                                        player.setAttribute("position", pos);
                                        return; // Interrompe para não processar outros comandos
                                    }
                                }

                                // Verificar se está na frente dos quadros do fundo (Z próximo de posFundoZ)
                                if (pos.z <= limiteFundoZ) {
                                    if (key === "a" || key === "arrowleft") {
                                        // Se estiver à direita do centro, vai para o centro
                                        if (pos.x > 0.5) {
                                            pos.x = 0; // Alinha com o centro
                                            player.setAttribute("position", pos);
                                        } else {
                                            // Se já estiver no centro ou esquerda do fundo, volta para a parede lateral
                                            targetRotation = 90; // Gira para esquerda
                                            isRotating = true;
                                            pos.z = -116; // Z do quadro 30
                                            pos.x = 0; // Volta para o trilho central
                                            player.setAttribute("position", pos);
                                        }
                                    } else if (key === "d" || key === "arrowright") {
                                        // Se estiver à esquerda do centro, vai para o centro
                                        if (pos.x < -0.5) {
                                            pos.x = 0; // Alinha com o centro
                                            player.setAttribute("position", pos);
                                        } else {
                                            // Transição Especial: 33 (Fundo) -> 32 (Direita)
                                            // Z do quadro 32: -116
                                            targetRotation = 270; // Gira para direita
                                            isRotating = true;
                                            pos.z = -116; // Z do quadro 32
                                            pos.x = 0; // Volta para o trilho central
                                            player.setAttribute("position", pos);
                                        }
                                    }
                                } else {
                                    // Comportamento padrão de rotação no corredor
                                    if (key === "a" || key === "arrowleft") {
                                        targetRotation += 90;
                                        isRotating = true;
                                        if (Math.abs(targetRotation / 90) % 2 !== 0) {
                                            centralizarNoQuadro();
                                        }
                                    } else if (key === "d" || key === "arrowright") {
                                        targetRotation -= 90;
                                        isRotating = true;
                                        if (Math.abs(targetRotation / 90) % 2 !== 0) {
                                            centralizarNoQuadro();
                                        }
                                    }
                                }

                                if (key === "s" || key === "arrowdown") {
                                    targetRotation += 180;
                                    isRotating = true;
                                }
                            } else if (olhandoParaTras) {
                                const pos = player.getAttribute("position");

                                // Pular para trás (voltando para a entrada) ao apertar W ou Seta para Cima
                                if (key === "w" || key === "arrowup") {
                                    let nextZ = null;
                                    // Voltando para a entrada (Z aumenta)
                                    for (let i = 0; i < quadrosZ.length; i++) {
                                        if (quadrosZ[i] > pos.z + 0.5) {
                                            if (nextZ === null || quadrosZ[i] < nextZ) {
                                                nextZ = quadrosZ[i];
                                            }
                                        }
                                    }
                                    // Se não houver mais quadros laterais atrás, pular para a entrada
                                    if (nextZ === null && pos.z < 0) {
                                        nextZ = 0;
                                    }

                                    if (nextZ !== null) {
                                        pos.z = nextZ;
                                        player.setAttribute("position", pos);
                                        return;
                                    }
                                }

                                if (key === "a" || key === "arrowleft") {
                                    targetRotation += 90;
                                    isRotating = true;
                                    if (Math.abs(targetRotation / 90) % 2 !== 0) {
                                        centralizarNoQuadro();
                                    }
                                } else if (key === "d" || key === "arrowright") {
                                    targetRotation -= 90;
                                    isRotating = true;
                                    if (Math.abs(targetRotation / 90) % 2 !== 0) {
                                        centralizarNoQuadro();
                                    }
                                } else if (key === "s" || key === "arrowdown") {
                                    targetRotation += 180;
                                    isRotating = true;
                                }
                            } else {
                                // Outras direções (Ex: olhando para trás)
                                if (key === "a" || key === "arrowleft") {
                                    targetRotation += 90;
                                    isRotating = true;
                                    if (Math.abs(targetRotation / 90) % 2 !== 0) {
                                        centralizarNoQuadro();
                                    }
                                } else if (key === "d" || key === "arrowright") {
                                    targetRotation -= 90;
                                    isRotating = true;
                                    if (Math.abs(targetRotation / 90) % 2 !== 0) {
                                        centralizarNoQuadro();
                                    }
                                } else if (key === "s" || key === "arrowdown") {
                                    targetRotation += 180;
                                    isRotating = true;
                                }
                            }
                        }
                    }

                    document.addEventListener(
                        "keydown",
                        function (event) {
                            const key = event.key.toLowerCase();
                            teclas[key] = true;
                            processarComando(key);
                        }
                    );



                    document.addEventListener(
                        "keyup",
                        function (event) {

                            teclas[
                                event.key.toLowerCase()
                                ] = false;

                        }
                    );

                    // Lógica para botões mobile
                    const mobileBtns = {
                        'btn-up': 'w',
                        'btn-down': 's',
                        'btn-left': 'a',
                        'btn-right': 'd'
                    };

                    Object.keys(mobileBtns).forEach(id => {
                        const btn = document.getElementById(id);
                        const key = mobileBtns[id];
                        
                        btn.addEventListener('touchstart', (e) => {
                            e.preventDefault();
                            e.stopPropagation();
                            teclas[key] = true;
                            processarComando(key);
                        }, { passive: false });

                        btn.addEventListener('mousedown', (e) => {
                            e.preventDefault();
                            e.stopPropagation();
                            teclas[key] = true;
                            processarComando(key);
                        });
                        
                        btn.addEventListener('touchend', (e) => {
                            e.preventDefault();
                            e.stopPropagation();
                            teclas[key] = false;
                        }, { passive: false });

                        btn.addEventListener('mouseup', (e) => {
                            e.preventDefault();
                            e.stopPropagation();
                            teclas[key] = false;
                        });

                        btn.addEventListener('mouseleave', (e) => {
                            teclas[key] = false;
                        });
                    });




                    /* =================================================
                       INTERAÇÃO COM AS OBRAS
                       ================================================= */

                    const hud = document.getElementById("hud-info");
                    const hudTitle = document.getElementById("hud-title");
                    const hudAuthor = document.getElementById("hud-author");

                    const overlay = document.getElementById("overlay");
                    const overlayImg = document.getElementById("overlay-img");
                    const overlayTitle = document.getElementById("overlay-title");
                    const overlayAuthor = document.getElementById("overlay-author");
                    const overlayTech = document.getElementById("overlay-tech");
                    const closeOverlay = document.getElementById("close-overlay");
                    const overlayPrev = document.getElementById("overlay-prev");
                    const overlayNext = document.getElementById("overlay-next");

                    // RASTREAMENTO DE OBRAS VISTAS
                    let obrasVistas = JSON.parse(localStorage.getItem('obrasVistas') || '[]');
                    let totalObras = 0;
                    let listaObras = [];
                    let currentObraId = null;

                    async function initChecklist() {
                        const resp = await fetch('obras.json');
                        listaObras = await resp.json();
                        totalObras = listaObras.length;
                        updateChecklistUI();
                    }

                    function marcarComoVista(id) {
                        id = parseInt(id);
                        if (!obrasVistas.includes(id)) {
                            obrasVistas.push(id);
                            localStorage.setItem('obrasVistas', JSON.stringify(obrasVistas));
                            updateChecklistUI();
                        }
                    }

                    function updateChecklistUI() {
                        const trigger = document.getElementById('checklist-trigger');
                        const progress = document.getElementById('checklist-progress');
                        const itemsContainer = document.getElementById('checklist-items');
                        
                        trigger.textContent = `Ver Progresso (${obrasVistas.length}/${totalObras})`;
                        
                        if (totalObras > 0 && obrasVistas.length === totalObras) {
                            trigger.classList.add('completou');
                            trigger.textContent = "✓ Todas as Telas Vistas!";
                        } else {
                            trigger.classList.remove('completou');
                        }

                        const porcentagem = totalObras > 0 ? Math.round((obrasVistas.length / totalObras) * 100) : 0;
                        progress.textContent = `${porcentagem}% Completo`;
                        
                        itemsContainer.innerHTML = '';
                        listaObras.forEach(obra => {
                            const vista = obrasVistas.includes(parseInt(obra.id));
                            const li = document.createElement('li');
                            li.className = `checklist-item ${vista ? 'visto' : ''}`;
                            li.innerHTML = `
                                <input type="checkbox" ${vista ? 'checked' : ''}>
                                <span>Tela ${obra.id}: ${obra.titulo}</span>
                            `;
                            itemsContainer.appendChild(li);
                        });
                    }

                    document.getElementById('checklist-trigger').onclick = () => {
                        document.getElementById('checklist-panel').classList.toggle('active');
                    };

                    initChecklist();
                    document.addEventListener('touchstart', function (e) {
                        // Impedir comportamento padrão de toque duplo que pode disparar fullscreen em alguns navegadores
                        if (e.touches.length > 1) {
                            e.preventDefault();
                        }
                        
                        if (e.target && e.target.closest && (e.target.closest('.mobile-btn') || e.target.closest('#checklist-trigger') || e.target.closest('#checklist-panel'))) {
                            // Deixa o evento seguir para os controles
                        } else {
                            // Se for toque na área da cena, podemos opcionalmente prevenir comportamentos se necessário,
                            // mas o A-Frame lida com isso.
                        }
                    }, { passive: true });

                    document.addEventListener('mouseenter', function (evt) {
                        if (evt.target && evt.target.closest && evt.target.closest('#mobile-controls')) return;
                        if (evt.target.classList && evt.target.classList.contains('interactable')) {
                            // Feedback visual no cursor ao passar sobre a obra
                            document.getElementById('cursor').setAttribute('color', '#ffcc00');
                            document.getElementById('cursor').setAttribute('scale', '0.8 0.8 0.8');
                        }
                    }, true);

                    document.addEventListener('mouseleave', function (evt) {
                        if (evt.target.classList && evt.target.classList.contains('interactable')) {
                            // Volta cursor ao normal
                            document.getElementById('cursor').setAttribute('color', '#fff');
                            document.getElementById('cursor').setAttribute('scale', '0.5 0.5 0.5');
                        }
                    }, true);

                    let clickTimer = null;
                    document.addEventListener('click', function (evt) {
                        // Impedir que cliques nos controles mobile disparem a abertura de obras
                        if (evt.target && evt.target.closest && evt.target.closest('#mobile-controls')) {
                            return;
                        }

                        // Impedir que clique nos botões de navegação lateral feche o overlay
                        if (evt.target && evt.target.closest && evt.target.closest('.nav-btn')) {
                            return;
                        }
                        
                        if (evt.target.classList && evt.target.classList.contains('interactable')) {
                            const numero = evt.target.getAttribute('data-numero');
                            const lado = evt.target.getAttribute('data-lado');

                            if (clickTimer) {
                                // Double click detected
                                clearTimeout(clickTimer);
                                clickTimer = null;
                                // Girar 90 graus conforme o lado
                                girar90Graus(lado);
                            } else {
                                clickTimer = setTimeout(() => {
                                    clickTimer = null;
                                    // Single click: ir para a tela do lado (navegar entre quadros)
                                    // Se estiver no fundo, talvez abrir a obra ou navegar
                                    if (lado === 'fundo') {
                                        abrirObra(numero);
                                    } else {
                                        const direcao = lado === 'esquerda' ? -1 : 1;
                                        const moveu = navegarEntreQuadros(direcao);
                                        if (!moveu) {
                                            abrirObra(numero);
                                        }
                                    }
                                }, 300);
                            }
                        }
                    }, true);

                    function girar90Graus(lado) {
                        let novaRotacao = targetRotation;
                        if (lado === 'esquerda') {
                            novaRotacao += 90;
                        } else if (lado === 'direita') {
                            novaRotacao -= 90;
                        } else if (lado === 'fundo') {
                            // No fundo, talvez girar 180 ou algo assim, mas o pedido diz 90
                            novaRotacao += 90; 
                        }
                        
                        targetRotation = novaRotacao;
                        isRotating = true;
                    }

                    function abrirObra(id) {
                        const obra = listaObras.find(o => parseInt(o.id) === parseInt(id));
                        if (!obra) return;

                        currentObraId = parseInt(id);

                        overlayImg.src = `tela${id}.jpg`;
                        overlayTitle.textContent = obra.titulo;
                        overlayAuthor.textContent = obra.autor;
                        overlayTech.textContent = obra.tecnica;

                        marcarComoVista(id);
                        overlay.classList.add('active');
                    }

                    function navegarObra(direcao) {
                        if (currentObraId === null || listaObras.length === 0) return;

                        // Encontrar o índice atual na listaObras (que segue a ordem do JSON/admin)
                        const currentIndex = listaObras.findIndex(o => parseInt(o.id) === currentObraId);
                        let nextIndex;

                        if (direcao === 'next') {
                            nextIndex = (currentIndex + 1) % listaObras.length;
                        } else {
                            nextIndex = (currentIndex - 1 + listaObras.length) % listaObras.length;
                        }

                        const proximaObra = listaObras[nextIndex];
                        abrirObra(proximaObra.id);
                    }

                    function fecharOverlay() {
                        overlay.classList.remove('active');
                        currentObraId = null;
                    }

                    closeOverlay.addEventListener('click', fecharOverlay);
                    
                    // Ajuste no clique do overlay para fechar apenas se clicar fora da imagem/info/botões
                    overlay.addEventListener('click', function(e) {
                        if (e.target === overlay) {
                            fecharOverlay();
                        }
                    });

                    overlayPrev.onclick = (e) => {
                        e.stopPropagation();
                        navegarObra('prev');
                    };

                    overlayNext.onclick = (e) => {
                        e.stopPropagation();
                        navegarObra('next');
                    };

                    // Navegação por teclado (Setas e Esc)
                    window.addEventListener('keydown', function(e) {
                        if (overlay.classList.contains('active')) {
                            if (e.key === 'ArrowRight') {
                                navegarObra('next');
                            } else if (e.key === 'ArrowLeft') {
                                navegarObra('prev');
                            } else if (e.key === 'Escape') {
                                fecharOverlay();
                            } else {
                                // Qualquer outra tecla fecha o overlay (conforme comportamento original)
                                fecharOverlay();
                            }
                        }
                    });

                    /* =================================================
                       MOVIMENTAÇÃO

                       A altura NÃO muda.
                       ================================================= */

                    const velocidade =
                        0.075;



                    function movimentar() {


                        /*
                         * Verificação de segurança.
                         */

                        if (!player) {

                            return;

                        }


                        /*
                         * Posição atual.
                         */

                        const pos =
                            player.getAttribute(
                                "position"
                            );


                        if (!pos) {

                            return;

                        }


                        /*
                         * Suavização da rotação.
                         */

                        const diff =
                            targetRotation -
                            currentRotation;


                        if (
                            Math.abs(
                                diff
                            ) > 0.1
                        ) {

                            currentRotation +=
                                diff *
                                0.15; // Velocidade de rotação levemente aumentada

                        } else {

                            currentRotation =
                                targetRotation;
                            isRotating = false; // Permite novo comando de rotação

                        }


                        player.setAttribute(
                            "rotation",
                            `0 ${currentRotation} 0`
                        );




                        /* =============================================
                           FRENTE / TRÁS
                           ============================================= */

                        // No "trilho", o movimento é frontal baseado na orientação atual.
                        // W/ArrowUp sempre move para onde o jogador está olhando.

                        if (
                            teclas["w"] ||
                            teclas["arrowup"]
                        ) {

                            const rad =
                                (currentRotation *
                                    Math.PI) /
                                180;
                            pos.x -=
                                Math.sin(rad) *
                                velocidade;
                            pos.z -=
                                Math.cos(rad) *
                                velocidade;

                        }



                        /* =============================================
                           LIMITES LATERAIS E TRILHO
                           ============================================= */

                        // Mantemos o jogador no centro do corredor (trilho),
                        // EXCETO na zona de fundo (Z <= -105) onde há o tapete em T.
                        if (pos.z > -105) {
                            pos.x = 0;
                        } else {
                            // Limites laterais na zona de fundo (tapete transversal)
                            if (pos.x < -3) pos.x = -3;
                            if (pos.x > 3) pos.x = 3;
                        }



                        /* =============================================
                           LIMITES DO CORREDOR
                           ============================================= */

                        if (
                            pos.z >
                            4
                        ) {

                            pos.z =
                                4;

                        }


                        if (
                            pos.z <
                            posFundoZ
                        ) {

                            pos.z =
                                posFundoZ;

                        }



                        /* =============================================
                           ALTURA FIXA
                           ============================================= */

                        pos.y =
                            1.7;



                        /*
                         * Atualiza posição.
                         */

                        player.setAttribute(
                            "position",
                            pos
                        );

                        // Carregamento progressivo de quadros
                        verificarCarregamentoProgressivo(pos.z);


                        /*
                         * Próximo frame.
                         */

                        requestAnimationFrame(
                            movimentar
                        );

                    }



                    /*
                     * Começa movimento.
                     */

                    movimentar();



                    finalizarCarregamento();

                    console.log(
                        "Museu Virtual V2.1 iniciado."
                    );


                    console.log(
                        "18 quadros configurados."
                    );

            }



            /* =================================================
               ERROS DE IMAGEM
               ================================================= */

            window.addEventListener(
                "error",
                function (event) {

                    if (
                        event.target &&
                        event.target.tagName ===
                        "IMG"
                    ) {

                        console.warn(
                            "Imagem não encontrada:",
                            event.target.src
                        );

                    }

                },
                true
            );

        }
    );

</script>
